<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/icon.png" />

    <!-- SEO Básico -->
    <title>GrasDesign | Agencia de Marketing Digital y Desarrollo Web</title>
    <meta
      name="description"
      content="GrasDesign: Agencia de diseño web y desarrollo de alto rendimiento. Creamos webs escalables, rápidas y rentables para potenciar tu negocio."
    />
    <meta name="author" content="GrasDesign" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://grasdesign.com" />
    <!-- REEMPLAZAR con el dominio real -->

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="GrasDesign | Agencia de Marketing Digital"
    />
    <meta
      property="og:description"
      content="Creamos webs espectaculares y ultra-rápidas para conseguirte más clientes."
    />
    <!-- IMPORTANTE: Sustituir esta ruta por una URL absoluta (https://tudominio.com/assets/og-image.jpg) cuando se publique -->
    <meta
      property="og:image"
      content="https://grasdesign.com/assets/og-image.jpg"
    />
    <meta property="og:url" content="https://grasdesign.com" />
    <meta property="og:site_name" content="GrasDesign" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GrasDesign | Desarrollo Web y Marketing"
    />
    <meta
      name="twitter:description"
      content="Diseño web premium y embudos de ventas para escalar tu facturación."
    />
    <meta
      name="twitter:image"
      content="https://grasdesign.com/assets/og-image.jpg"
    />

    <!-- Performance: Preconnect para fuentes -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.0.3/dist/fonts/geist-sans/style.css"
    />
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
