<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/assets/icon.webp" />
    <link rel="apple-touch-icon" href="/assets/icon.png" />

    <!-- SEO Personalizado (Primera Persona) -->
    <title>Diseño Web y Digitalización de Negocios | GrasDesign</title>
    <meta
      name="description"
      content="Diseño y desarrollo tu web para que sea ultra-rápida, escalable y venda. Te ayudo a digitalizar tu negocio con soluciones a medida. ¡Solicita tu auditoría gratis conmigo!"
    />
    <meta name="keywords" content="diseño web, desarrollo web, digitalización, marketing digital, autónomo diseño web, Kit Digital, optimización web, GrasDesign" />
    <meta name="author" content="GrasDesign" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://grasdesign.com" />

    <!-- Open Graph (Personalizado) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="GrasDesign | Impulso tu negocio con diseño web de alto impacto"
    />
    <meta
      property="og:description"
      content="Llevo tu negocio al siguiente nivel con una web que de verdad funcione. Rendimiento extremo y digitalización inteligente hecha por mí."
    />
    <meta
      property="og:image"
      content="https://grasdesign.com/assets/logo.png"
    />
    <meta property="og:url" content="https://grasdesign.com" />
    <meta property="og:site_name" content="GrasDesign" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GrasDesign | Desarrollo Web y Digitalización"
    />
    <meta
      name="twitter:description"
      content="Tu web es tu mejor comercial. La diseño y desarrollo para que sea ultra-rápida y rentable."
    />
    <meta
      name="twitter:image"
      content="https://grasdesign.com/assets/logo.png"
    />

    <!-- JSON-LD Structured Data (Schema Personalizado) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "GrasDesign",
      "image": "https://grasdesign.com/assets/logo.png",
      "@id": "https://grasdesign.com",
      "url": "https://grasdesign.com",
      "telephone": "+34657828903",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "",
        "addressLocality": "Bilbao",
        "postalCode": "",
        "addressCountry": "ES"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 43.2630126,
        "longitude": -2.9349852
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday"
        ],
        "opens": "09:00",
        "closes": "18:00"
      },
      "sameAs": [
        "https://www.linkedin.com/company/grasdesign"
      ],
      "priceRange": "$$",
      "description": "Diseño y desarrollo webs de alto rendimiento y ayudo a negocios a digitalizarse de forma inteligente. Trato directo y soluciones personalizadas.",
      "serviceArea": "Spain"
    }
    </script>

    <!-- Performance: Preconnect para fuentes -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
